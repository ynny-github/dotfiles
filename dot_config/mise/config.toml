[tools]
starship = "latest"
assh = "latest"
herdr = "latest"
lazygit = "latest"
uv = "latest"
yazi = "latest"
cargo-binstall = "latest"
"cargo:fresh-editor" = "latest"
glow = "latest"
helix = "latest"
"pipx:copier" = "latest"
infisical = { version = "latest", asset_pattern = "cli_{{ version }}_{{ os(macos='darwin') }}_{{ arch(x64='amd64') }}.tar.gz" }
claude-code = "latest"

[hooks]
# Tarball modes are applied verbatim on extract, so umask cannot strip them
postinstall = 'd="${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}/installs"; if [ -d "$d" ]; then find "$d" ! -type l -perm -g+w -exec chmod g-w,o-w {} + || true; fi'
